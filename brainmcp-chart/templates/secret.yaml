{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brainmcp.fullname" . }}
  labels:
    {{- include "brainmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  GIT_TOKEN: {{ required "secrets.gitToken is required (or set secrets.existingSecret)" .Values.secrets.gitToken | quote }}
  OAUTH_CLIENT_SECRET: {{ required "secrets.oauthClientSecret is required (or set secrets.existingSecret)" .Values.secrets.oauthClientSecret | quote }}
  PERSONAL_AUTH_TOKEN: {{ required "secrets.personalAuthToken is required (or set secrets.existingSecret)" .Values.secrets.personalAuthToken | quote }}
  {{- with .Values.secrets.staticBearerTokens }}
  MCP_STATIC_BEARER_TOKENS: {{ . | quote }}
  {{- end }}
{{- end }}

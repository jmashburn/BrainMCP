name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `latest` alone will not move a Helm release: an upgrade with unchanged
      # values renders the same pod template, so nothing rolls and the new image
      # is never pulled. The per-commit tag changes the template, which is what
      # makes the upgrade take — so hand over the exact command.
      - name: Summarize how to deploy this build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # `|| true`: the image is already pushed by now, so a tag that does not
          # match must not fail the job — it just means no command is printed.
          pinned="$(echo "$TAGS" | grep -E ':main-[0-9a-f]+$' | head -n1 || true)"
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            if [ -n "$pinned" ]; then
              echo ""
              echo "Deploy this build with Helm:"
              echo ""
              echo '```bash'
              echo "helm upgrade brainmcp ./brainmcp-chart -n brain --reuse-values --set image.tag=${pinned##*:}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
